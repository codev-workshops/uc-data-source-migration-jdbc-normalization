# Test-only overrides (layered on top of src/main/resources/application.properties).
# Each Spring test context gets its own in-memory databases so cached contexts never re-run
# schema scripts against a database another context already initialised.
spring.datasource.url=jdbc:h2:mem:modern-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
legacy.datasource.url=jdbc:h2:mem:legacydw-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.show-sql=false
