# =============================================================================
# LEGACY data-source profile (test-scoped)
# =============================================================================
# Self-contained init for the CDW-style legacy warehouse so the contract suite
# does not depend on the main application.properties. Reuses the existing
# schema/seed SQL resources (already on the classpath) rather than duplicating
# the 5/5/5/10 seed data.
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
