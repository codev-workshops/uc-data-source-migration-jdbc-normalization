# =============================================================================
# MODERN data-source profile (test-scoped) -- ACCEPTANCE GATE
# =============================================================================
# Points the contract suite at the normalized modern schema seeded with the
# MIGRATED equivalent of the legacy dataset. This profile is exercised by the
# `modern` datasource parameter, which is DISABLED until data-source migration
# Tasks 1-3 (modern JPA entities + rewired LoanService) are complete.
spring.datasource.url=jdbc:h2:mem:moderndw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-modern.sql
