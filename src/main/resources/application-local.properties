# Local demo/debug profile: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Never enable in production: exposes the H2 console, migration error details and SQL logs.
management.endpoint.health.show-details=always
spring.jpa.show-sql=true

# H2 Console - connect to jdbc:h2:mem:loandb or jdbc:h2:mem:legacydw (user sa, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
