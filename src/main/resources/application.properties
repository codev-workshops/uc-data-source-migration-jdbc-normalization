spring.application.name=loan-service

# Legacy Data Source Configuration (PRIMARY)
# This connects to the legacy data warehouse (CDW-style) tables.
# Wired in LegacyDataSourceConfig; schema/data loaded via spring.sql.init.* below.
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Modern Data Source Configuration
# Normalized target schema. Wired in ModernDataSourceConfig; schema created from
# schema-modern.sql. Starts empty — populated by the migration (Task 2).
app.modern.datasource.url=jdbc:h2:mem:moderndw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.modern.datasource.driverClassName=org.h2.Driver
app.modern.datasource.username=sa
app.modern.datasource.password=

# Read-path feature flag: which data source backs the public API.
#   legacy (default) → read from the legacy CDW tables
#   modern           → read from the modern normalized schema
# The public API contract is identical in both modes.
loanservice.datasource=legacy

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize legacy schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
