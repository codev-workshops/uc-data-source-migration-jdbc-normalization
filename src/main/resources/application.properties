spring.application.name=loan-service

# =============================================================================
# Primary data source: MODERN normalized schema
# REST endpoints read from this schema unless loan-service.read-source=legacy.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:modern;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-modern.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# =============================================================================
# REST read source (LoanDataSource): modern (default) | legacy
# Chosen at startup; to switch, change it and restart, e.g. LOAN_SERVICE_READ_SOURCE=legacy
# or --loan-service.read-source=legacy. Both sources return the same DTOs for migrated data.
# =============================================================================
loan-service.read-source=modern

# =============================================================================
# Secondary data source: LEGACY CDW tables (DEPRECATED)
# Source for DataMigrationService, and for the REST API when loan-service.read-source=legacy.
# =============================================================================
legacy.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
legacy.datasource.driver-class-name=org.h2.Driver
legacy.datasource.username=sa
legacy.datasource.password=

legacy.sql.init.mode=always
legacy.sql.init.schema-locations=classpath:schema-legacy.sql
legacy.sql.init.data-locations=classpath:data-legacy.sql

# =============================================================================
# Legacy -> modern migration (DataMigrationRunner)
# =============================================================================
migration.run-on-startup=true
migration.fail-on-error=true
# ShedLock lease on the modern database; must outlast a full run. Expires on its own if an instance dies mid-run.
migration.lock-at-most-for=PT30M

# H2 Console exposes both databases, so it is only enabled by the dev profile (application-dev.properties)
spring.h2.console.enabled=false
