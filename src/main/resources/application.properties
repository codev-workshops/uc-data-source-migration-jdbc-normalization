spring.application.name=loan-service

# Modern normalized data source (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize the modern schema and seed data on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-modern.sql
