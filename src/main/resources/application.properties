spring.application.name=loan-service

# Single in-memory H2 database hosting BOTH schemas during the migration window:
#   - legacy CDW_* tables (seeded from data-legacy.sql) are the migration source
#   - modern normalized tables are populated by DataMigrationService at startup and
#     are the application's primary read path
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema init: legacy + modern DDL; only the legacy tables are seeded.
# The legacy schema/data can be dropped once the migration no longer runs at startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql,classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-legacy.sql

# Run the legacy -> modern migration (and reconciliation) at startup.
loanservice.migration.enabled=true
