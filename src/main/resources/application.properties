spring.application.name=loan-service

# =============================================================================
# DUAL DATA SOURCE CONFIGURATION
# Both the legacy CDW tables and the modern normalized tables are wired at once
# (see LegacyDataSourceConfig / ModernDataSourceConfig). The runtime feature flag
# `loanservice.datasource` below selects which one the API reads from; it can
# also be flipped without a restart via PUT /api/admin/datasource/{legacy|modern}.
# Schema/seed are initialized programmatically per data source (DataSourceInitializer),
# so Spring Boot's single-datasource auto-init (spring.sql.init.*) is not used.
# =============================================================================

# Dual-read feature flag: which data source the API serves reads from.
loanservice.datasource=legacy

# Legacy data source (CDW-style tables; schema-legacy.sql + data-legacy.sql).
app.datasource.legacy.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.legacy.driver-class-name=org.h2.Driver
app.datasource.legacy.username=sa
app.datasource.legacy.password=

# Modern data source (normalized tables; schema-modern.sql, populated by the ETL).
app.datasource.modern.url=jdbc:h2:mem:moderndw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.modern.driver-class-name=org.h2.Driver
app.datasource.modern.username=sa
app.datasource.modern.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging; bound to the primary/legacy data source)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
