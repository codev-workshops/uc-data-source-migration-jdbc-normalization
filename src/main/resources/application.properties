spring.application.name=loan-service

# Legacy Data Source Configuration
# This connects to the legacy data warehouse (CDW-style) tables
# MIGRATION TARGET: Replace with modern schema connection
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Modern Data Source Configuration
# Normalized schema (see data/modern-schema/modern_tables.sql), runs alongside legacy
modern.datasource.url=jdbc:h2:mem:moderndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
modern.datasource.driverClassName=org.h2.Driver
modern.datasource.username=sa
modern.datasource.password=

modern.jpa.database-platform=org.hibernate.dialect.H2Dialect
modern.jpa.hibernate.ddl-auto=none

# Initialize modern schema on startup from the approved DDL
modern.sql.init.schema-locations=classpath:modern_tables.sql

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize legacy schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
