spring.application.name=loan-service

# =============================================================================
# Data sources
# =============================================================================
# Two data sources are wired explicitly (see com.workshop.loanservice.config):
#   - legacy: the CDW-style warehouse, still the @Primary DataSource so that
#     spring.sql.init.* seeds it and reconciliation/rollback stay possible.
#   - modern: the normalized schema that backs LoanService (and therefore the
#     public REST API) once DataMigrationService has run at startup.
# The default single-datasource auto-configuration is disabled because both
# DataSource beans are declared by the configuration classes.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.datasource.legacy.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.legacy.driver-class-name=org.h2.Driver
spring.datasource.legacy.username=sa
spring.datasource.legacy.password=

spring.datasource.modern.url=jdbc:h2:mem:moderndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.modern.driver-class-name=org.h2.Driver
spring.datasource.modern.username=sa
spring.datasource.modern.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging) — attached to the primary (legacy) data source
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize the legacy schema/data on the primary (legacy) data source only.
# The modern schema is created from schema-modern.sql by ModernDataSourceConfig
# and populated by DataMigrationService.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
