spring.application.name=loan-service

# Logging (Logback, structured pattern in logback-spring.xml)
logging.level.com.workshop.loanservice=INFO

# Selects the data path behind the REST layer: legacy (CDW_* tables) or normalized.
application.data-mode=normalized

# Legacy Data Source Configuration
# This connects to the legacy data warehouse (CDW-style) tables
# MIGRATION TARGET: Replace with modern schema connection
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Legacy Spring SQL initialization (disabled: Flyway owns the schema now)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql

# Flyway is the sole schema owner
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
