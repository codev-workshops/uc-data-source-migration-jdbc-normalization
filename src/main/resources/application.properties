spring.application.name=loan-service

# Logging (Logback, structured pattern in logback-spring.xml)
logging.level.com.workshop.loanservice=INFO

# Data Source Configuration (normalized schema, managed by Flyway)
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring SQL initialization disabled: Flyway owns the schema
spring.sql.init.mode=never

# Flyway is the sole schema owner
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
