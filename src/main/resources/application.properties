spring.application.name=loan-service

# Two DataSources are configured programmatically (see config package):
#   - legacyDataSource  (jdbc:h2:mem:legacydw)  : source CDW schema + seed data
#   - modernDataSource  (jdbc:h2:mem:moderndb)  : normalized target schema (PRIMARY)
# Each has its own EntityManagerFactory and transaction manager. Schema/data are
# initialized via DataSourceInitializer beans, so Spring Boot's single-datasource
# auto-initialization (spring.sql.init.*) is intentionally not used.

spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Dual-read feature flag: which schema the API read path serves from.
#   MODERN (default) -> normalized modern schema (post-migration target)
#   LEGACY           -> original CDW tables (fallback / reversible cutover)
# Switchable at runtime via PUT /api/admin/datasource-mode/{MODERN|LEGACY}.
loanservice.datasource.mode=MODERN
