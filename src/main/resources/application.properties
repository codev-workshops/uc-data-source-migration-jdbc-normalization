spring.application.name=loan-service

# Data Source Configuration (single in-memory H2 holding both schemas).
# System of record for the API is the MODERN schema. The legacy CDW tables are
# retained only as the source for the one-time startup migration; no API read
# path touches them.
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schemas on startup. Both the modern (target) and legacy (migration
# source) schemas are created in the same in-memory H2 instance. Only the legacy
# tables are seeded; DataMigrationRunner copies the data into the modern tables
# at boot, after which the API serves exclusively from the modern schema.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-modern.sql,classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
