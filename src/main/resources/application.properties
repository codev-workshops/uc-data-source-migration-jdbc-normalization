spring.application.name=loan-service

# Legacy Data Source Configuration (kept for migration/comparison)
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging legacy data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize legacy schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql

# =============================================================================
# DynamoDB Configuration (Modern Data Source)
# =============================================================================
# For local development with DynamoDB Local:
#   dynamodb.endpoint=http://localhost:8000
# For AWS (uses DefaultCredentialsProvider):
#   Leave dynamodb.endpoint empty and configure AWS credentials
dynamodb.endpoint=
dynamodb.region=us-east-1
