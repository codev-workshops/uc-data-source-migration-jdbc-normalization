spring.application.name=loan-service

# Which schema serves the API: "modern" (default, normalized tables) or
# "legacy" (deprecated CDW tables, kept for rollback and comparison).
loan.datasource.mode=modern

# Copy legacy CDW rows into the modern schema on startup. The migration is
# idempotent: rows already present (by natural key) are skipped.
loan.migration.run-on-startup=true
# true: abort startup when the migration fails or reconciliation finds a MISMATCH
loan.migration.fail-on-error=false

# /actuator/health/readiness is DOWN if the startup migration failed or reconciliation found a mismatch
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,migration
# Component statuses (UP/DOWN) are public; details (migration report, mismatches) are hidden by default and shown by the local profile
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# Monitoring: health, info and metrics only (no env, beans, heapdump, ...). In production serve them on an
# internal port (management.server.port) or behind auth, since metrics reveal traffic and JVM internals.
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
management.info.java.enabled=true
info.app.name=${spring.application.name}
info.app.datasource-mode=${loan.datasource.mode}

# Every log line carries the request's X-Request-Id (blank outside requests)
logging.pattern.level=%5p [requestId=%X{requestId:-}]

# Modern data source (primary)
app.datasource.modern.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.modern.driver-class-name=org.h2.Driver
app.datasource.modern.username=sa
app.datasource.modern.password=

# Legacy CDW data source (migration source)
app.datasource.legacy.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.legacy.driver-class-name=org.h2.Driver
app.datasource.legacy.username=sa
app.datasource.legacy.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Local-only debugging flags (SQL logging, H2 console, full health details) live in
# application-local.properties: run with --spring.profiles.active=local
spring.h2.console.enabled=false
