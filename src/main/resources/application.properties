spring.application.name=loan-service

# Legacy Data Source (CDW-style warehouse, read-only source of the migration)
# Schema and seed data are loaded by LegacyDataSourceConfig.
spring.datasource.legacy.jdbc-url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.legacy.driver-class-name=org.h2.Driver
spring.datasource.legacy.username=sa
spring.datasource.legacy.password=

# Modern Data Source (normalized target schema, primary)
# Schema is loaded by ModernDataSourceConfig; rows come from MigrationService.
spring.datasource.modern.jdbc-url=jdbc:h2:mem:moderndw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.modern.driver-class-name=org.h2.Driver
spring.datasource.modern.username=sa
spring.datasource.modern.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console (for debugging; attaches to one JDBC URL at a time)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Both data sources are initialized programmatically, so the single-data-source
# initializer is switched off.
spring.sql.init.mode=never

# Which data source serves the REST API: legacy or modern.
loanservice.datasource.mode=modern

# Both H2 databases are in-memory, so the legacy-to-modern migration runs on
# every boot. It is idempotent, so re-running is a no-op once data is present.
loanservice.migration.run-on-startup=true
