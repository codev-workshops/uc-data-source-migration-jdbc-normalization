spring.application.name=loan-service

# Data Source Configuration
# The application now serves the modern normalized schema. The legacy CDW
# tables live in the same database purely as the migration source and are
# read once at startup by DataMigrationService.
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize both schemas on startup (legacy = migration source, modern = served)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql,classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-legacy.sql

# Run the legacy -> modern data migration at startup
loanservice.migration.run-on-startup=true
