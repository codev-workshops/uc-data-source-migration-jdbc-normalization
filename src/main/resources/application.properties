spring.application.name=loan-service

# Data Source Configuration
# Single authoritative data source. It holds both the modern tables (read by the
# application) and the legacy CDW-style tables (migration source only).
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schemas on startup: legacy (migration source) then modern (runtime),
# followed by the legacy seed data. DataMigrationService then populates the
# modern tables from the legacy ones.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql,classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
