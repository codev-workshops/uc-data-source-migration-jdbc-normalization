spring.application.name=loan-service

# Data Source Configuration
# A SINGLE in-memory H2 instance now holds BOTH the legacy CDW_* tables and the
# modern normalized tables. On startup the legacy schema+data load first, then
# the modern (empty) schema is created; DataMigrationService then copies the
# legacy rows into the modern tables (see DATA_SOURCE_MIGRATION_NOTES.md).
# The application's service layer reads exclusively from the modern tables.
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema initialization: legacy schema first (source data), then the modern
# normalized schema. Explicit DDL is preferred over Hibernate auto-DDL so the
# modern constraints/indexes from data/modern-schema/modern_tables.sql are kept.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql,classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-legacy.sql

# Legacy -> modern data migration on startup. Disable in tests that want to
# control seeding themselves. The migration is idempotent (skips if the modern
# tables are already populated).
migration.enabled=true
