spring.application.name=loan-service

# =============================================================================
# Data sources
# =============================================================================
# Two logical stores for the duration of the migration:
#   legacy - CDW-style tables, extract side of the backfill and rollback target
#   modern - normalized schema, primary, becomes the system of record at cutover
app.datasource.legacy.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.legacy.driver-class-name=org.h2.Driver
app.datasource.legacy.username=sa
app.datasource.legacy.password=${LEGACY_DB_PASSWORD:}
app.datasource.legacy.hikari.pool-name=legacy-pool
app.datasource.legacy.hikari.maximum-pool-size=5
app.datasource.legacy.hikari.register-mbeans=true

app.datasource.modern.url=jdbc:h2:mem:moderndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.modern.driver-class-name=org.h2.Driver
app.datasource.modern.username=sa
app.datasource.modern.password=${MODERN_DB_PASSWORD:}
app.datasource.modern.hikari.pool-name=modern-pool
# Sized in docs/ARCHITECTURE_ANALYSIS.md section 3.8: connections = cores * 2 + effective spindles.
app.datasource.modern.hikari.maximum-pool-size=20
app.datasource.modern.hikari.minimum-idle=5
app.datasource.modern.hikari.connection-timeout=3000
app.datasource.modern.hikari.register-mbeans=true

# =============================================================================
# Read/write routing
# =============================================================================
# legacy      - read from CDW (pre-migration behaviour)
# modern      - read from the normalized schema
# dual-read   - read modern, shadow-read legacy and report drift (reconciliation window)
loanservice.read-source=modern
# Append every write to the legacy store as well while the reconciliation window is open.
loanservice.dual-write=true
# Backfill legacy -> modern on startup. Idempotent, so restarts are safe.
loanservice.migration.run-on-startup=true
loanservice.migration.chunk-size=1000
# strict: any rejected row fails the run. lenient: rejects are reported and the run continues.
loanservice.migration.mode=strict
# Log a WARN and increment a counter when an unbounded v1 list exceeds this many rows.
# This never truncates a response: the v1 contract is frozen.
loanservice.v1.large-response-warn-threshold=1000

# =============================================================================
# JPA
# =============================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =============================================================================
# H2 console - disabled by default, enabled only in the dev profile
# =============================================================================
spring.h2.console.enabled=false

spring.sql.init.mode=never

# =============================================================================
# Observability
# =============================================================================
# Only the endpoints that are needed. Exposing "*" hands out /actuator/env and /actuator/heapdump,
# which is a credential leak, not a monitoring feature.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=loan-service
# Percentile histograms are computed in the backend, not client-side estimates, so P99 across pods
# is meaningful rather than an average of averages.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.loanservice.payment.post=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,250ms,500ms,1s,2s
# Sample everything: this is a workshop-scale service, and partial traces make a P99 investigation
# guesswork. Lower this before running it under production traffic.
management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.com.workshop.loanservice=INFO
# Hibernate statistics feed the metrics, but its per-session log block would be one 12-line entry
# per transaction - exactly the log flooding the logging policy forbids.
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

