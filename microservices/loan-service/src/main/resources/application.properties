spring.application.name=loan-service-ms
server.port=8082

# Loan-service database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize loan schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-loan.sql
spring.sql.init.data-locations=classpath:data-loan.sql

# Cross-service URLs
services.payment-service.url=http://localhost:8083
services.borrower-service.url=http://localhost:8081

# Actuator
management.endpoints.web.exposure.include=health,info
