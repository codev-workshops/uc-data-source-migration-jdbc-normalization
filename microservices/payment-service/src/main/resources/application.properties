spring.application.name=payment-service
server.port=8083

# Payment-service database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize payment schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-payment.sql
spring.sql.init.data-locations=classpath:data-payment.sql

# Actuator
management.endpoints.web.exposure.include=health,info
